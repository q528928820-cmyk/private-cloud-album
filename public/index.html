
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827"><title>私人云相册</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="top"><div><h1>私人云相册</h1><p>只属于你的照片空间</p></div><button id="logoutBtn" class="ghost hidden">退出登录</button></header>
    <section id="loginPanel" class="panel login"><h2>登录相册</h2><p class="muted">请输入管理员密码</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button class="primary" type="submit">登录</button></form><p id="loginError" class="error"></p></section>
    <section id="appPanel" class="hidden">
      <section class="toolbar panel">
        <div class="album-tools"><label for="albumSelect">当前相册</label><select id="albumSelect"></select><button id="newAlbumBtn" class="secondary">新建相册</button></div>
        <div class="actions"><label class="upload secondary" for="photoInput">＋ 上传照片</label><input id="photoInput" type="file" accept="image/*" multiple hidden><button id="backupBtn" class="secondary">备份 ZIP</button><label class="secondary upload" for="restoreInput">恢复 ZIP</label><input id="restoreInput" type="file" accept=".zip,application/zip" hidden></div>
      </section>
      <p id="status" class="status" aria-live="polite"></p>
      <section id="photoGrid" class="grid"></section>
      <p id="emptyState" class="empty">这个相册还没有照片，点击“上传照片”添加。</p>
      <p class="footnote">照片文件保存在 Cloudinary，照片信息保存在 Cloudflare D1。请定期下载 ZIP 备份并妥善保存。</p>
    </section>
  </main>
  <dialog id="albumDialog"><form method="dialog" id="albumForm"><h3>新建相册</h3><input id="albumName" maxlength="80" placeholder="相册名称" required><div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" value="default" type="submit">创建</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="/app.js"></script>
</body></html>
